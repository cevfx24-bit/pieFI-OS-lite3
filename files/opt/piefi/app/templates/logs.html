{% extends 'base.html' %}{% set title='Activity logs' %}{% block content %}<section class="panel"><div class="panelhead"><div><h2>Administrative activity</h2><small>Latest 200 recorded actions</small></div></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.at|int|datetime}}</td><td>{{r.actor}}</td><td><b>{{r.action}}</b></td><td>{{r.detail}}</td></tr>{% else %}<tr><td colspan="4" class="empty">No activity recorded yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
