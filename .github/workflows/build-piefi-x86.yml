name: Build PieFi OS Lite x86_64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version
        required: true
        default: '24.10.2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coreutils \
            build-essential \
            zstd \
            wget \
            tar \
            python3 \
            perl \
            gawk \
            gettext \
            unzip \
            file \
            xz-utils

          echo "Checking GNU install..."
          command -v install
          install --version

      - name: Download OpenWrt ImageBuilder
        run: |
          VERSION="${{ inputs.openwrt_version }}"
          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64"

          wget -q "${URL}/openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"

          tar --use-compress-program=unzstd \
            -xf "openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"

          IB="$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -1)"

          echo "ImageBuilder=$IB" >> "$GITHUB_ENV"

      - name: Stage PieFi files
        run: |
          mkdir -p "$ImageBuilder/files/etc"

          if [ -f config/banner ]; then
            cp config/banner "$ImageBuilder/files/etc/banner"
          fi

          echo "PieFi OS Lite" > "$ImageBuilder/files/etc/piefi-release"

      - name: Build PieFi OS Lite
        run: |
          cd "$ImageBuilder"

          mkdir -p tmp

          make image \
            PROFILE="generic" \
            PACKAGES="luci luci-ssl curl wget ca-bundle ip-full tcpdump-mini ethtool" \
            FILES="files" \
            FORCE=1

      - name: Upload PieFi firmware
        uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-Lite-x86_64
          path: |
            openwrt-imagebuilder-*/bin/targets/x86/64/*.img.gz
            openwrt-imagebuilder-*/bin/targets/x86/64/*.vmdk
            openwrt-imagebuilder-*/bin/targets/x86/64/*.img
            openwrt-imagebuilder-*/bin/targets/x86/64/*.manifest
          if-no-files-found: warn
          retention-days: 14
