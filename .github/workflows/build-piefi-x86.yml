name: Build PieFi OS Lite x86_64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version
        required: true
        default: '24.10.2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils build-essential zstd wget tar python3 perl gawk gettext unzip file xz-utils

      - name: Download OpenWrt ImageBuilder
        run: |
          VERSION="${{ inputs.openwrt_version }}"
          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64"
          wget -q "${URL}/openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
          tar --use-compress-program=unzstd -xf "openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
          IB="$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -1)"
          echo "ImageBuilder=$IB" >> "$GITHUB_ENV"

      - name: Stage PieFi overlay files
        run: |
          mkdir -p "$ImageBuilder/files"
          cp -a files/. "$ImageBuilder/files/"

      - name: Build PieFi OS Lite
        run: |
          cd "$ImageBuilder"
          make image \
            PROFILE="generic" \
            PACKAGES="luci luci-ssl opennds curl wget ca-bundle ip-full tcpdump-mini ethtool kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm kmod-usb-net-rndis kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 kmod-usb-net-r8152 kmod-usb-net-smsc95xx" \
            FILES="files" \
            FORCE=1

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-Lite-x86_64
          path: |
            openwrt-imagebuilder-*/bin/targets/x86/64/*.img.gz
            openwrt-imagebuilder-*/bin/targets/x86/64/*.vmdk
            openwrt-imagebuilder-*/bin/targets/x86/64/*.img
            openwrt-imagebuilder-*/bin/targets/x86/64/*.manifest
          if-no-files-found: warn
          retention-days: 14
