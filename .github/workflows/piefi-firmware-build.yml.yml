name: PieFi V3 Firmware Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd python3 gzip coreutils curl
      - name: Download and unpack OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/piefi-build" "$HOME/piefi-build-v3"
          cd "$HOME/piefi-build"
          URL="https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$URL" -o imagebuilder.tar.zst
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst
          test -f "$HOME/piefi-build/openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64/Makefile"
      - name: Stage PieFi source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/piefi-build-v3"
          cp -a . "$HOME/piefi-build-v3/"
          mkdir -p "$HOME/piefi-build-v3/output"
      - name: Validate source scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n "$HOME/piefi-build-v3/pieFi-V3-build.sh"
          test -s "$HOME/piefi-build-v3/files/opt/piefi/app/app.py"
          test -s "$HOME/piefi-build-v3/piefi-v3-packages.txt"
      - name: Run PieFi build
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/piefi-build-v3"
          bash ./pieFi-V3-build.sh
      - name: Collect firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d "$HOME/piefi-build-v3/output/PIEFI-V3-UPDATED"
          mkdir -p output
          cp -a "$HOME/piefi-build-v3/output/PIEFI-V3-UPDATED" output/
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-Lite-V3-firmware
          path: output/PIEFI-V3-UPDATED/
          if-no-files-found: error
