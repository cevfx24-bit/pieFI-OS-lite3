name: PieFi x86-64 firmware build
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zstd python3 python3-flask wget xz-utils
      - name: Download OpenWrt ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst -O ib.tar.zst
          tar --zstd -xf ib.tar.zst
          IB_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -n 1)
          test -n "$IB_DIR"
          mv "$IB_DIR" imagebuilder
      - name: Prepare and build
        run: |
          cd imagebuilder
          mkdir -p files
          cp -a ../files/. files/
          PACKAGES=$(tr '\n' ' ' < ../packages.txt)
          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files"
      - name: Collect image and checksum
        run: |
          mkdir -p output
          find imagebuilder/bin/targets/x86/64 -maxdepth 1 -type f \( -name '*.img.gz' -o -name '*.img' -o -name '*.vdi' -o -name '*.vmdk' -o -name '*.manifest' -o -name '*.sha256sum' \) -exec cp {} output/ \;
          if [ -z "$(ls -A output)" ]; then echo 'No firmware files collected' >&2; exit 1; fi
          cd output && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-Lite-Reloaded-x86-64
          path: output/*
