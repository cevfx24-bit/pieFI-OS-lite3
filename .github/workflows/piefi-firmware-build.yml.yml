name: PieFi V3 Firmware Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd python3 gzip sha256sum
      - name: Download and unpack OpenWrt ImageBuilder
        run: |
          set -e
          mkdir -p "$HOME/piefi-build" "$HOME/piefi-build-v3"
          cd "$HOME/piefi-build"
          URL="https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$URL" -o imagebuilder.tar.zst
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst
          mv openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64 "$HOME/piefi-build/openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64"
      - name: Stage PieFi source
        run: |
          cp -a . "$HOME/piefi-build-v3/"
          mkdir -p "$HOME/piefi-build-v3/output"
          sed -i "s|ROOT=\"\$HOME/piefi-build-v3\"|ROOT=\"\$HOME/piefi-build-v3\"|" pieFi-V3-build.sh
      - name: Run build
        run: bash ./pieFi-V3-build.sh
      - name: Collect output into workspace
        run: cp -a "$HOME/piefi-build-v3/output/PIEFI-V3-UPDATED" output/PIEFI-V3-UPDATED
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-Lite-V3-firmware
          path: output/PIEFI-V3-UPDATED/
          if-no-files-found: error
